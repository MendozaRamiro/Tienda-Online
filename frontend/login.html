<!DOCTYPE html>
<html lang="es">

<head>

  <meta charset="UTF-8">

  <title>Login</title>

  <link rel="stylesheet" href="style.css">

</head>

<body class="login-body">

  <div class="login-box">

    <h1>Tienda Online</h1>

    <input
      type="text"
      id="usuario"
      placeholder="Usuario"
    >
    <input
     type="password"
     id="password"
     placeholder="Contraseña"
    >

    <button onclick="iniciarSesion()">
      Ingresar
    </button>

    <p>
      ¿No tenés cuenta?
    </p>

    <a href="registro.html">
      Crear cuenta
    </a>

  </div>

  <script src="login.js"></script>

</body>

</html>
